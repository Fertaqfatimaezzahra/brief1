    <section class="section section--claire">

      <div class="conteneur">

        <h1>Contact</h1>

        <p class="section__intro">
          Une question, une proposition ? Écrivez-moi.
        </p>


        <!-- ========== FORMULAIRE ========== -->

        <form class="formulaire" action="#" method="post">

          <label for="nom">Nom</label>

          <input
            id="nom"
            name="nom"
            type="text"
            required
          >


          <label for="email">E-mail</label>

          <input
            id="email"
            name="email"
            type="email"
            required
          >


          <label for="sujet">Sujet</label>

          <input
            id="sujet"
            name="sujet"
            type="text"
            required
          >


          <label for="message">Message</label>

          <textarea
            id="message"
            name="message"
            rows="6"
            required
          ></textarea>


          <button class="bouton" type="submit">
            Envoyer
          </button>

        </form>


        <!-- ========== RÉSEAUX ========== -->
